<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Import — Stockout Shield</title>
    <meta name="description" content="Forecast medicine demand, track inventory and prevent stockouts.">
    <meta property="og:title" content="Import — Stockout Shield">
    <meta property="og:description" content="Forecast medicine demand, track inventory and prevent stockouts.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛡%3C/text%3E%3C/svg%3E">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="vendor/supabase.min.js" defer></script>
    <script src="vendor/xlsx.min.js" defer></script>
    <script src="vendor/chart.min.js" defer></script>
    <script src="config.js" defer></script>
    <script src="forecast.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body data-page="import">
    <header class="topbar">
        <div class="topbarleft"><a class="brand" href="index.html"><span class="logo">🛡</span>
                <div><b>Stockout Shield</b><small>Medicine demand forecasting</small></div>
            </a><a class="btn brandcta account-link" href="signin.html">Sign in</a></div>
        <nav><a class="navlink " href="index.html">Home</a><a class="navlink " href="forecast.html">Forecast</a><a
                class="navlink " href="inventory.html">Inventory</a><a class="navlink active" href="import.html">Import
                Excel</a><a class="navlink " href="suppliers.html">Suppliers</a><a class="btn navcta account-link"
                href="signin.html">Sign in</a></nav>
    </header>
    <main>
        <div class="guest-banner" hidden><span><b>Guest mode</b> · Demo data only</span><button
                class="btn ghost exit-guest">Exit guest mode</button></div>
        <section class="page" id="import">
            <h2>Import from Excel</h2>
            <p class="muted">Upload .xlsx, .xls or .csv — any number of medicines and sheets. Columns are matched
                automatically.</p>
            <div class="needauth muted">Sign in to import. <a class="btn" href="signin.html">Sign in</a></div>
            <div class="authonly">
                <label class="drop">Choose a spreadsheet<input accept=".xlsx,.xls,.csv" hidden="" id="file"
                        type="file" /></label>
                <div class="card" hidden="" id="mapper">
                    <h3>Match columns</h3>
                    <div class="row" id="mapSelects"></div>
                    <p id="readyMsg"></p>
                    <div class="scroll">
                        <table id="previewTable"></table>
                    </div>
                    <button class="btn" id="saveImport">Save</button>
                </div>
                <p id="importMsg"></p>
            </div>
        </section>
    </main>
</body>

</html>
