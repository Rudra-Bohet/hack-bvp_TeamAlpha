<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in — Stockout Shield</title>
    <meta name="description" content="Forecast medicine demand, track inventory and prevent stockouts.">
    <meta property="og:title" content="Sign in — Stockout Shield">
    <meta property="og:description" content="Forecast medicine demand, track inventory and prevent stockouts.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛡%3C/text%3E%3C/svg%3E">
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="vendor/supabase.min.js" defer></script>
    <script src="vendor/xlsx.min.js" defer></script>
    <script src="vendor/chart.min.js" defer></script>
    <script src="config.js" defer></script>
    <script src="forecast.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body data-page="auth">
    <header class="topbar">
        <div class="topbarleft"><a class="brand" href="index.html"><span class="logo">🛡</span>
                <div><b>Stockout Shield</b><small>Medicine demand forecasting</small></div>
            </a><a class="btn brandcta account-link" href="signin.html">Sign in</a></div>
        <nav><a class="navlink " href="index.html">Home</a><a class="navlink " href="forecast.html">Forecast</a><a
                class="navlink " href="inventory.html">Inventory</a><a class="navlink " href="import.html">Import
                Excel</a><a class="navlink " href="suppliers.html">Suppliers</a><a class="btn navcta account-link"
                href="signin.html">Sign in</a></nav>
    </header>
    <main>
        <div class="guest-banner" hidden><span><b>Guest mode</b> · Demo data only</span><button
                class="btn ghost exit-guest">Exit guest mode</button></div>
        <section class="page" id="auth">
            <div class="card authcard">
                <div class="seg"><button class="on" id="mSignin">Sign in</button><button id="mSignup">Sign up</button>
                </div>
                <form id="authForm">
                    <div class="signup-only"><label>Full name<input name="full_name" /></label>
                        <label>Shop type<select name="shop_type">
                                <option value="medical_shop">Medical shop</option>
                                <option value="hospital">Hospital</option>
                                <option value="seller">Seller / Distributor</option>
                            </select></label>
                        <label>Address<input name="address" /></label>
                    </div>
                    <label>Email<input name="email" required="" type="email" /></label>
                    <label>Password<input minlength="6" name="password" required="" type="password" /></label>
                    <p id="authMsg"></p>
                    <button class="btn wide" id="authBtn">Sign in</button>
                </form>
                <button class="linklike" id="forgotPassword">Forgot your password?</button>
                <div class="divider"><span>or</span></div><button class="btn ghost wide googlebtn"
                    id="googleSignIn">Continue with Google</button><button class="btn ghost wide googlebtn"
                    id="guestSignIn">♙ Continue as guest</button>
                <p hidden="" id="sessionLabel"></p><button class="btn ghost wide" hidden="" id="signOut">Sign
                    out</button>
            </div>
        </section>
    </main>
</body>

</html>
